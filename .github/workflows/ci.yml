jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend        # <‑‑ fixed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .
      - name: Run pytest
        run: pytest tests

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend        # <‑‑ fixed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install npm dependencies
        run: npm install                   # <‑‑ changed from `npm ci`
      - name: Lint (ESLint + Prettier)
        run: |
          npm run lint
          npm run format-check
      - name: Build Next.js app
        run: npm run build

  docker-build:
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build backend Docker image
        run: |
          docker build -t forge-backend -f backend/Dockerfile.backend .
      - name: Build frontend Docker image
        run: |
          docker build -t forge-frontend -f frontend/Dockerfile.frontend .